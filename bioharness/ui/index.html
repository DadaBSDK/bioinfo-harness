<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioinfo Harness</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1917; --muted: #6b6862;
  --line: #e3e0d9; --accent: #2f6f4f; --accent-soft: #e8f1ec;
  --ok: #2f7d52; --fail: #b03a2e; --run: #b57614; --skip: #8a867e; --block: #8a5a00;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181a; --panel: #1d2023; --ink: #e8e6e1; --muted: #9a968e;
    --line: #2e3236; --accent: #6fbf95; --accent-soft: #1f2f27;
    --ok: #6fbf95; --fail: #e0725f; --run: #e0a94a; --skip: #7d7a74; --block: #d99a3a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
header {
  display: flex; align-items: center; gap: 20px; padding: 0 18px;
  height: 52px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 10;
}
.brand { font-weight: 600; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; }
nav button {
  background: none; border: 0; padding: 7px 13px; border-radius: 7px;
  color: var(--muted); font: inherit; cursor: pointer;
}
nav button:hover { background: var(--accent-soft); color: var(--ink); }
nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.meta { color: var(--muted); font: 12px/1 var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--ok); }
.dot.stale { background: var(--skip); }

main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 52px); }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
.side-h {
  font: 600 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); padding: 16px 16px 8px;
}
.run-item {
  padding: 9px 16px; cursor: pointer; border-left: 2px solid transparent;
  display: flex; gap: 9px; align-items: baseline;
}
.run-item:hover { background: var(--accent-soft); }
.run-item.on { background: var(--accent-soft); border-left-color: var(--accent); }
.run-item .wf { font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .id { font: 11px var(--mono); color: var(--muted); }
.agent-row { padding: 6px 16px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.agent-row .role { color: var(--muted); font-size: 11px; margin-left: auto; }
.badge {
  min-width: 18px; text-align: center; border-radius: 9px; padding: 1px 6px;
  font: 11px var(--mono); background: var(--accent-soft); color: var(--accent);
}
.budget { margin: 12px 16px 24px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; }
.budget div { display: flex; justify-content: space-between; font: 12px var(--mono); padding: 2px 0; }
.budget .k { color: var(--muted); }

section { padding: 22px 26px 60px; overflow-x: hidden; }
h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 18px; }
.card > h3 {
  margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
  font: 600 11px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.card-body { padding: 14px 16px; }
.scroll { overflow-x: auto; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th {
  text-align: left; font: 600 11px/1 var(--mono); letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted); padding: 9px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--accent-soft); }
code, .mono { font-family: var(--mono); font-size: 12px; }
.trunc { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

.pill {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font: 600 11px/1.5 var(--mono); text-transform: uppercase; letter-spacing: .04em;
}
.s-ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.s-failed { background: color-mix(in srgb, var(--fail) 15%, transparent); color: var(--fail); }
.s-running { background: color-mix(in srgb, var(--run) 18%, transparent); color: var(--run); }
.s-skipped, .s-pending { background: color-mix(in srgb, var(--skip) 15%, transparent); color: var(--skip); }
.s-blocked { background: color-mix(in srgb, var(--block) 18%, transparent); color: var(--block); }

svg.dag { display: block; min-width: 100%; }
.node rect { rx: 9; stroke-width: 1.5; }
.node text { font: 12px -apple-system, sans-serif; }
.node .cap { font: 10px var(--mono); fill: var(--muted); }
.node.clickable { cursor: pointer; }
.node.clickable:hover rect { stroke-width: 2.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.stat { padding: 14px 16px; }
.stat .n { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
.stat .l { color: var(--muted); font-size: 12px; }
pre.log {
  margin: 0; padding: 14px 16px; background: var(--bg); border-radius: 0 0 10px 10px;
  font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
  max-height: 380px; overflow-y: auto;
}
.tabs { display: flex; gap: 4px; padding: 10px 16px 0; }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px;
  color: var(--muted); font: inherit; cursor: pointer;
}
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.empty { color: var(--muted); padding: 30px 16px; text-align: center; font-size: 13px; }
input.search {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit;
}
.kv { font: 12px var(--mono); }
.kv .k { color: var(--accent); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 0; }
.msg { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; margin: 6px 0; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">Bioinfo <span>Harness</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <div class="meta"><span class="dot" id="pulse"></span> <span id="tick">—</span></div>
</header>

<main>
  <aside>
    <div class="side-h">Runs</div>
    <div id="runs"></div>
    <div class="side-h">Agents</div>
    <div id="agents"></div>
    <div class="side-h">Budget</div>
    <div class="budget" id="budget"></div>
  </aside>
  <section id="view"></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const state = { tab: 'runs', runId: null, runs: [], detail: null, hive: null,
                caps: null, overview: null, log: null, logTab: 'stderr' };
const TABS = ['runs', 'hive', 'caps', 'cost'];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtSecs = s => s == null ? '—' : s < 60 ? `${(+s).toFixed(1)}s`
  : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
const shortId = id => String(id || '').replace(/^run-/, '').slice(0, 8);
const pill = s => `<span class="pill s-${esc(s)}">${esc(s)}</span>`;

async function api(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

// ---- data ---------------------------------------------------------------
async function refresh(full = false) {
  try {
    const [runs, overview] = await Promise.all([api('/api/runs'), api('/api/overview')]);
    state.runs = runs; state.overview = overview;
    if (!state.runId && runs.length) state.runId = runs[0].run_id;
    if (state.runId) state.detail = await api(`/api/runs/${state.runId}`).catch(() => null);
    if (state.tab === 'hive' || full || !state.hive) state.hive = await api('/api/hive');
    if ((state.tab === 'caps' && !state.caps) || full) state.caps = await api('/api/caps');
    $('#pulse').className = 'dot';
    $('#tick').textContent = new Date().toLocaleTimeString();
  } catch (e) {
    $('#pulse').className = 'dot stale';
    $('#tick').textContent = 'disconnected';
  }
  render();
}

// ---- DAG ----------------------------------------------------------------
function layout(graph) {
  const byId = Object.fromEntries(graph.map(s => [s.id, s]));
  const depth = {};
  const walk = (id, seen = new Set()) => {
    if (depth[id] != null) return depth[id];
    if (seen.has(id)) return 0;
    seen.add(id);
    const needs = (byId[id]?.needs || []).filter(n => byId[n]);
    depth[id] = needs.length ? Math.max(...needs.map(n => walk(n, seen))) + 1 : 0;
    return depth[id];
  };
  graph.forEach(s => walk(s.id));
  const cols = {};
  graph.forEach(s => (cols[depth[s.id]] ||= []).push(s));
  return { cols, depth };
}

function renderDag(graph, tasks) {
  if (!graph.length) return `<div class="empty">No graph recorded for this run.</div>`;
  const status = {};
  tasks.forEach(t => {
    const base = String(t.step).split('.')[0];
    // A scattered step is only "ok" when every shard is.
    status[base] = status[base] && status[base] !== t.status ? 'running' : t.status;
  });
  const { cols } = layout(graph);
  const W = 172, H = 54, GX = 68, GY = 22, PAD = 16;
  const depths = Object.keys(cols).map(Number).sort((a, b) => a - b);
  const pos = {};
  depths.forEach(d => cols[d].forEach((s, i) => {
    pos[s.id] = { x: PAD + d * (W + GX), y: PAD + i * (H + GY) };
  }));
  const width = PAD * 2 + depths.length * W + (depths.length - 1) * GX;
  const height = PAD * 2 + Math.max(...depths.map(d => cols[d].length)) * (H + GY);

  const color = s => ({ ok: 'var(--ok)', failed: 'var(--fail)', running: 'var(--run)',
    blocked: 'var(--block)' }[s] || 'var(--skip)');

  let edges = '', nodes = '';
  graph.forEach(s => {
    (s.needs || []).forEach(n => {
      if (!pos[n]) return;
      const a = pos[n], b = pos[s.id];
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
      const mx = (x1 + x2) / 2;
      edges += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });
  });
  graph.forEach(s => {
    const p = pos[s.id], st = status[s.id] || 'pending', c = color(st);
    const shards = tasks.filter(t => String(t.step).split('.')[0] === s.id);
    const label = s.scatter && shards.length > 1 ? `${s.id} ×${shards.length}` : s.id;
    nodes += `<g class="node clickable" data-step="${esc(s.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${W}" height="${H}" fill="var(--panel)" stroke="${c}"/>
      <rect width="4" height="${H}" fill="${c}" rx="2"/>
      <text x="14" y="21" fill="var(--ink)" font-weight="500">${esc(label)}</text>
      <text x="14" y="38" class="cap">${esc(s.capability)}</text>
      <text x="${W - 12}" y="21" text-anchor="end" font-size="10"
            fill="${c}" font-family="var(--mono)">${esc(st)}</text>
    </g>`;
  });
  return `<div class="scroll"><svg class="dag" width="${width}" height="${height}"
    viewBox="0 0 ${width} ${height}">${edges}${nodes}</svg></div>`;
}

// ---- views --------------------------------------------------------------
function viewRuns() {
  const d = state.detail;
  if (!d) return `<div class="empty">No runs yet. Try:<br><br>
    <code>bioharness run wgs-variants --dry-run --set reads=… --set reference=…</code></div>`;
  const m = d.manifest, s = d.summary || {};
  const tasks = d.tasks || [];
  const rows = tasks.map(t => `<tr class="clickable" data-step="${esc(t.step)}">
      <td>${pill(t.status)}</td>
      <td class="mono">${esc(t.step)}</td>
      <td><code>${esc(t.capability)}</code></td>
      <td class="mono">${fmtSecs(t.seconds)}</td>
      <td><span class="trunc mono" title="${esc(t.command || t.error)}">${
        esc(t.error || t.command || '')}</span></td>
    </tr>`).join('');

  const arts = (d.artifacts || []).map(a => `<tr>
      <td class="mono">${esc(a.name)}</td>
      <td><span class="trunc mono">${esc(a.path)}</span></td>
      <td class="mono">${(a.bytes / 1024).toFixed(1)} kB</td>
      <td class="mono" title="${esc(a.sha256)}">${esc(String(a.sha256).slice(0, 12))}…</td>
    </tr>`).join('');

  return `
  <h2>${esc(m.workflow)} ${m.dry_run ? pill('dry-run') : pill(s.status || 'running')}</h2>
  <div class="sub mono">${esc(m.run_id)} · ${esc(m.created_iso || '')} · ${esc(d.dir)}</div>

  <div class="card"><h3>Pipeline</h3>${renderDag(d.graph || [], tasks)}</div>

  <div class="card"><h3>Steps</h3><div class="scroll"><table>
    <thead><tr><th>Status</th><th>Step</th><th>Capability</th><th>Time</th>
    <th>Command / error</th></tr></thead><tbody>${rows || ''}</tbody></table></div>
    ${tasks.length ? '' : '<div class="empty">No steps recorded yet.</div>'}</div>

  ${state.log ? `<div class="card"><h3>${esc(state.log.step)} — logs</h3>
    <div class="tabs">
      ${['stderr', 'stdout'].map(t => `<button data-logtab="${t}"
        class="${state.logTab === t ? 'on' : ''}">${t}</button>`).join('')}
    </div>
    <pre class="log">${esc(state.log.text || '(empty)')}</pre></div>` : ''}

  <div class="card"><h3>Parameters</h3><div class="card-body kv">
    ${Object.entries(m.params || {}).map(([k, v]) =>
      `<div><span class="k">${esc(k)}</span> = ${esc(JSON.stringify(v))}</div>`).join('')
      || '<span class="l">none</span>'}</div></div>

  <div class="card"><h3>Artifacts (SHA-256)</h3>${arts ? `<div class="scroll"><table>
    <thead><tr><th>Port</th><th>Path</th><th>Size</th><th>Hash</th></tr></thead>
    <tbody>${arts}</tbody></table></div>`
    : '<div class="empty">No artifacts recorded.</div>'}</div>

  <details><summary>Provenance ledger (${(d.ledger || []).length} events)</summary>
    <pre class="log">${esc((d.ledger || []).map(e =>
      `${new Date(e.ts * 1000).toISOString()}  ${e.event}  ${JSON.stringify(e.payload)}`
    ).join('\n'))}</pre></details>`;
}

function viewHive() {
  const h = state.hive;
  if (!h || !h.exists) return `<div class="empty">No hive at this path yet.
    Run <code>bioharness mission …</code> to create one.</div>`;
  const agents = (h.agents || []).map(a => `<div class="card">
    <h3>${esc(a.name)} · ${esc(a.role)}</h3><div class="card-body">
      <div class="kv"><span class="k">provider</span> ${esc(a.provider)}
        · <span class="k">autonomy</span> ${esc(a.autonomy || '—')}
        · <span class="k">inbox</span> ${a.inbox_pending}</div>
      ${(a.inbox || []).map(m => `<div class="msg"><b>${esc(m.topic)}</b>
        from ${esc(m.sender)}<br><span class="mono">${esc(JSON.stringify(m.body).slice(0, 220))}</span>
        </div>`).join('')}
      ${a.memory ? `<details><summary>memory.md</summary>
        <pre class="log">${esc(a.memory)}</pre></details>` : ''}
    </div></div>`).join('');

  const bb = (h.blackboard || []).map(e => `<tr>
      <td class="mono">${esc(e.key)}</td><td class="mono">${esc(e.agent || '')}</td>
      <td><span class="trunc mono">${esc(JSON.stringify(e.value))}</span></td></tr>`).join('');

  const ev = (h.events || []).slice(0, 60).map(e =>
    `${new Date(e.ts * 1000).toLocaleTimeString()}  ${e.event}  ${
      JSON.stringify(e.payload).slice(0, 150)}`).join('\n');

  return `<h2>Hive</h2><div class="sub mono">${esc(h.root)}</div>
    <div class="card"><h3>Memory palace</h3><div class="card-body">
      <input class="search" id="recall" placeholder="Search agent memory…">
      <div id="recall-out"></div></div></div>
    ${agents || '<div class="empty">No agents enrolled.</div>'}
    <div class="card"><h3>Blackboard</h3>${bb ? `<div class="scroll"><table>
      <thead><tr><th>Key</th><th>Agent</th><th>Value</th></tr></thead>
      <tbody>${bb}</tbody></table></div>` : '<div class="empty">Empty.</div>'}</div>
    <div class="card"><h3>Event log</h3><pre class="log">${esc(ev || '(none)')}</pre></div>`;
}

function viewCaps() {
  const caps = state.caps || [];
  const domains = [...new Set(caps.map(c => c.domain))];
  return `<h2>Capability registry</h2>
    <div class="sub">${caps.filter(c => c.available).length} of ${caps.length}
      available on this machine. Drop a YAML manifest in <code>capabilities/</code> to add one.</div>
    ${domains.map(dom => `<div class="card"><h3>${esc(dom)}</h3><div class="scroll"><table>
      <thead><tr><th></th><th>ID</th><th>Ports</th><th>Runtime</th>
      <th>Summary</th><th>Probe</th></tr></thead><tbody>
      ${caps.filter(c => c.domain === dom).map(c => `<tr>
        <td>${c.available ? '<span class="dot"></span>'
                          : '<span class="dot stale"></span>'}</td>
        <td class="mono">${esc(c.id)} <span style="color:var(--muted)">${esc(c.version)}</span></td>
        <td class="mono" style="color:var(--muted)">${
          esc(c.inputs.map(p => p.type).join(', ') || '—')} →
          ${esc(c.outputs.map(p => p.type).join(', ') || '—')}</td>
        <td class="mono">${esc(c.runtime)}</td>
        <td>${esc(c.summary)}</td>
        <td class="mono" style="color:var(--muted)">${esc(c.reason)}</td>
      </tr>`).join('')}</tbody></table></div></div>`).join('')}`;
}

function viewCost() {
  const o = state.overview || {}, c = (state.hive && state.hive.cost) || o.cost || {};
  const rows = Object.entries(c.by_agent || {}).map(([a, v]) => `<tr>
      <td class="mono">${esc(a)}</td><td class="mono">${v.calls}</td>
      <td class="mono">${v.tokens_in.toLocaleString()}</td>
      <td class="mono">${v.tokens_out.toLocaleString()}</td>
      <td class="mono">$${v.usd.toFixed(4)}</td></tr>`).join('');
  const st = (k, n, l) => `<div class="card stat"><div class="n">${n}</div>
    <div class="l">${l}</div></div>`;
  return `<h2>Cost &amp; guardrails</h2>
    <div class="sub">Real token accounting from the hive event log.
      Deterministic agents cost nothing.</div>
    <div class="grid2">
      ${st('u', '$' + (c.total_usd || 0).toFixed(4), 'total spend')}
      ${st('t', (c.total_tokens || 0).toLocaleString(), 'tokens')}
      ${st('r', (o.runs && o.runs.total) || 0, 'runs recorded')}
      ${st('c', `${(o.capabilities && o.capabilities.available) || 0}/${
        (o.capabilities && o.capabilities.total) || 0}`, 'capabilities available')}
    </div>
    <div class="card"><h3>By agent</h3>${rows ? `<div class="scroll"><table>
      <thead><tr><th>Agent</th><th>Calls</th><th>Tokens in</th><th>Tokens out</th>
      <th>USD</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="empty">No LLM calls charged — the roster has been running deterministically.</div>'}
    </div>`;
}

// ---- shell --------------------------------------------------------------
function renderSidebar() {
  $('#runs').innerHTML = state.runs.length ? state.runs.map(r => `
    <div class="run-item ${r.run_id === state.runId ? 'on' : ''}" data-run="${esc(r.run_id)}">
      <span class="pill s-${esc(r.status)}" style="padding:1px 6px">${
        esc(r.status[0].toUpperCase())}</span>
      <span class="wf">${esc(r.workflow)}</span>
      <span class="id">${esc(shortId(r.run_id))}</span>
    </div>`).join('') : '<div class="empty">none</div>';

  const agents = (state.hive && state.hive.agents) || [];
  $('#agents').innerHTML = agents.length ? agents.map(a => `
    <div class="agent-row"><span class="dot"></span>${esc(a.name)}
      <span class="badge">${a.inbox_pending}</span>
      <span class="role">${esc(a.role)}</span></div>`).join('')
    : '<div class="empty">none</div>';

  const g = (state.detail && state.detail.summary && state.detail.summary.guardrails) || null;
  const cost = (state.overview && state.overview.cost) || {};
  $('#budget').innerHTML = g ? `
    <div><span class="k">steps</span><span>${g.used.steps} / ${
      g.used.steps + (g.remaining.steps ?? 0)}</span></div>
    <div><span class="k">spend</span><span>$${(g.used.usd || 0).toFixed(4)}</span></div>
    <div><span class="k">tokens</span><span>${(g.used.tokens || 0).toLocaleString()}</span></div>
    <div><span class="k">elapsed</span><span>${fmtSecs(g.used.elapsed_s)}</span></div>
    <div><span class="k">breakers</span><span>${
      g.open_breakers.length ? g.open_breakers.join(', ') : 'closed'}</span></div>`
    : `<div><span class="k">spend</span><span>$${(cost.total_usd || 0).toFixed(4)}</span></div>
       <div><span class="k">tokens</span><span>${
         (cost.total_tokens || 0).toLocaleString()}</span></div>`;
}

function render() {
  $('#nav').innerHTML = TABS.map(t =>
    `<button data-tab="${t}" class="${state.tab === t ? 'on' : ''}">${t}</button>`).join('');
  renderSidebar();
  $('#view').innerHTML = { runs: viewRuns, hive: viewHive, caps: viewCaps, cost: viewCost }
    [state.tab]();
}

async function loadLog(step) {
  state.log = { step, text: 'loading…' };
  render();
  const r = await api(`/api/runs/${state.runId}/log?step=${
    encodeURIComponent(step)}&stream=${state.logTab}`);
  state.log = { step, text: r.exists ? r.text : `(no ${state.logTab}.log for ${step})` };
  render();
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; state.log = null; return refresh(); }
  const run = e.target.closest('[data-run]');
  if (run) { state.runId = run.dataset.run; state.log = null; return refresh(); }
  const step = e.target.closest('[data-step]');
  if (step) return loadLog(step.dataset.step);
  const lt = e.target.closest('[data-logtab]');
  if (lt && state.log) { state.logTab = lt.dataset.logtab; return loadLog(state.log.step); }
});

document.addEventListener('input', async e => {
  if (e.target.id !== 'recall') return;
  const q = e.target.value.trim();
  const out = $('#recall-out');
  if (!q) { out.innerHTML = ''; return; }
  const hits = await api('/api/recall?q=' + encodeURIComponent(q));
  out.innerHTML = hits.length ? hits.map(h => `<div class="msg">
      <b>${esc(h.agent)}</b> <span style="color:var(--muted)">[${esc(h.kind)}]</span><br>
      ${esc(h.text.slice(0, 400))}</div>`).join('')
    : '<div class="empty">nothing remembered about that</div>';
});

refresh(true);
setInterval(() => refresh(), 3000);
</script>
</body>
</html>
