name: dock-screen
description: Dock a ligand library against one receptor, one task per ligand.

params:
  receptor: null                 # --set receptor=/data/receptor.pdbqt
  ligands: []                    # --set ligands='["a.pdbqt","b.pdbqt"]'
  center: {x: 0, y: 0, z: 0}
  exhaustiveness: 16

steps:
  - id: dock
    capability: vina_dock
    scatter: ligand              # fans out into one task per ligand
    with:
      receptor: "{{ params.receptor }}"
      ligand: "{{ params.ligands }}"
    params:
      center_x: "{{ params.center.x }}"
      center_y: "{{ params.center.y }}"
      center_z: "{{ params.center.z }}"
      exhaustiveness: "{{ params.exhaustiveness }}"
